[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-digest"
version = "0.1.0"
description = "Daily markdown digest of job postings and hiring-signal posts, run locally from cron."
requires-python = ">=3.11"
dependencies = [
    # Pinned to a git commit, not the PyPI release. PyPI's python-jobspy
    # 1.1.82 was published 2025-07-28; this commit (2026-02-18) carries seven
    # months of fixes that were never released, including a LinkedIn
    # date-parsing fallback for the current listing format. Pinned rather than
    # tracking main so an upstream commit cannot silently change the digest.
    "python-jobspy @ git+https://github.com/speedyapply/JobSpy.git@fda080a373e8226f3fd60635323f5da9af9892b1",
    "PyYAML>=6.0",
]

[project.scripts]
jobdigest = "jobdigest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
