# Asaf Peled — job search profile.
# This file is meant to be edited by hand. Scoring (Phase 3) reads it directly;
# change a weight or a keyword here and re-run with --dry-run to see the effect
# without touching any live service.

identity:
  name: Asaf Peled
  headline: >-
    Senior Product Manager, fintech regulatory product.
    Regulatory product manager with AI as an added capability layer.
  years_experience: 12

background:
  domains:
    - regulatory product
    - KYC / AML
    - financial licensing
    - fintech
    - payments
    - compliance-tech
    - regtech
  current_work: >-
    Delivering financial licence applications for UAE and Japan.
  earlier_career:
    - KYC operations
    - governance leadership
    - consulting
    - knowledge management

# ---------------------------------------------------------------------------
# What a good role looks like
# ---------------------------------------------------------------------------
target_roles:
  titles:
    - Senior Product Manager
    - Product Manager
    - Principal Product Manager
    - Group Product Manager
    - Product Operations Lead
    - Head of Product Operations
    - Regulatory Product Manager
    - Technology Manager
    - Regulatory Manager
  # Individual contributor, or leading a small team. Not large-org people management.
  team_shape:
    individual_contributor: true
    small_team_lead: true          # roughly up to 5 reports
    large_org_people_management: false

industries:
  - fintech
  - payments
  - banking
  - compliance-tech
  - regtech
  - financial services

# ---------------------------------------------------------------------------
# Geography and commute
# ---------------------------------------------------------------------------
location:
  based_in: Rishon LeZion, Israel
  primary_markets:
    - Tel Aviv
    - Central District
    - Israel
  # Beyond this, the role needs WFH days to work at all.
  acceptable_commute_minutes_peak: 30
  wfh_days_required_beyond_commute: 2
  # Fully-remote anywhere, provided they hire in Israel or engage
  # international contractors.
  remote_anywhere_ok: true
  # More remote is better, but substance outweighs format.
  remote_preference_weight: modest

  # Commute tiers from Rishon LeZion, in peak traffic. These are judgement
  # calls, not measured drive times -- edit them freely.
  #
  # Note what this encodes: Tel Aviv is 'medium', not 'near'. Under the
  # 30-minute rule that means most Tel Aviv roles need WFH days to clear,
  # which is a real consequence of the constraint rather than an oversight.
  commute_tiers:
    near:            # roughly within 30 minutes
      - rishon lezion
      - rishon le zion
      - ראשון לציון
      - ness ziona
      - nes tziona
      - נס ציונה
      - rehovot
      - רחובות
      - holon
      - חולון
      - bat yam
      - בת ים
      - yavne
      - יבנה
      - beer yaakov
      - ramla
      - lod
      - לוד
      - gedera
    medium:          # roughly 30-50 minutes
      - tel aviv
      - tel aviv-yafo
      - tel-aviv
      - תל אביב
      - ramat gan
      - רמת גן
      - givatayim
      - גבעתיים
      - petah tikva
      - petach tikva
      - פתח תקווה
      - bnei brak
      - בני ברק
      - or yehuda
      - azor
      - airport city
      - modiin
      - מודיעין
    far:             # roughly 50 minutes or more
      - herzliya
      - הרצליה
      - raanana
      - ra'anana
      - רעננה
      - kfar saba
      - כפר סבא
      - hod hasharon
      - netanya
      - נתניה
      - jerusalem
      - ירושלים
      - haifa
      - חיפה
      - beer sheva
      - be'er sheva
      - באר שבע
      - caesarea
      - yokneam
      - ramat hasharon

  # Signals in the posting text that a role has WFH days, which is what
  # rescues a medium or far commute.
  hybrid_markers:
    - hybrid
    - work from home
    - wfh
    - remote days
    - days a week from home
    - flexible work
    - היברידי
    - עבודה מהבית
    - מהבית

# ---------------------------------------------------------------------------
# Compensation
# ---------------------------------------------------------------------------
compensation:
  income_floor_monthly_ils: 35000
  currency: ILS
  period: monthly
  # Open to a step down in level or pay for a better track, provided it
  # clears the floor above.
  open_to_step_down: true

  # Most Israeli postings carry no salary at all. When a posting does list
  # one, it is converted to monthly ILS using these static rates and compared
  # against the floor. They are approximate and hand-editable on purpose --
  # nothing here calls a live FX service.
  fx_to_ils:
    ILS: 1.0
    USD: 3.7
    EUR: 4.0
    GBP: 4.7

# ---------------------------------------------------------------------------
# Scoring
# ---------------------------------------------------------------------------
# Components sum to 100. Phase 3 reports each one separately in the digest.
scoring:
  weights:
    domain_fit: 45        # the thing that actually gets him past resume screen
    seniority_fit: 20
    role_type_fit: 20
    location_fit: 15
  buckets:
    strong: 70            # >= 70
    worth_a_look: 45      # >= 45
    # below worth_a_look => "stretch — likely resume-screen rejection"

  # Signals that raise domain fit.
  positive_keywords:
    strong:
      - regulatory
      - regulation
      - compliance
      - kyc
      - aml
      - anti-money laundering
      - licensing
      - regtech
      - financial crime
      - sanctions
      - onboarding
      - payments
      - fintech
      - psd2
      - open banking
      - risk
      # Hebrew. A large share of Israeli postings are written in Hebrew, and
      # without these a Hebrew regtech role scores zero domain fit and gets
      # penalised as a generic PM role.
      - רגולציה
      - רגולטורי
      - רגולטורית
      - ציות
      - הלבנת הון
      - איסור הלבנת הון
      - רישוי
      - רישיון
      - תשלומים
      - פינטק
      - סליקה
      - זיהוי לקוח
      - הכר את הלקוח
      - סיכונים
      - הונאות
    moderate:
      - banking
      - financial services
      - trading
      - crypto
      - digital wallet
      - card issuing
      - acquiring
      - lending
      - insurtech
      - identity verification
      - fraud
      # Hebrew
      - בנקאות
      - פיננסים
      - פיננסי
      - אשראי
      - כרטיסי אשראי
      - ארנק דיגיטלי
      - קריפטו
      - ביטוח
      - מסחר
      - הלוואות

  # Score down. Each entry subtracts from the relevant component.
  negative_keywords:
    # Generic PM with no regulatory / payments / compliance surface.
    # Handled structurally too: a PM role with zero positive_keywords hits
    # the no_domain_surface penalty below.
    large_team_management:
      - vp of product
      - vp product
      - chief product officer
      - cpo
      - director of product
      - head of product department
      - manage a team of
      - build and scale a team
      - hire and manage
      - people manager
      - managing managers
    compliance_analyst_dressed_as_product:
      - compliance analyst
      - compliance officer
      - aml analyst
      - kyc analyst
      - kyc specialist
      - compliance associate
      - transaction monitoring analyst
      - mlro
      - אנליסט ציות
      - בקר ציות
      - אנליסט הלבנת הון
    wrong_discipline:
      - software engineer
      - data scientist
      - account executive
      - sales
      - recruiter
      - customer success
      - marketing manager
      - designer
      - qa engineer
      - מהנדס תוכנה
      - מפתח תוכנה
      - איש מכירות
      - מעצב
      - מגייס
      - מגייסת

  penalties:
    no_domain_surface: 30       # generic PM, nothing regulatory/payments/compliance
    large_team_management: 25
    compliance_analyst: 35
    wrong_discipline: 60
    too_junior: 25
    too_senior: 15
